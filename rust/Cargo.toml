[package]
name = "batterybar-rust"
version = "3.0.0"
edition = "2021"

[dependencies]
cocoa = "0.26.1"
objc = "0.2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.40.2"
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
